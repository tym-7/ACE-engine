<!DOCTYPE html>
<html>
<head>
    <title>FNF: Dark Minds</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
        body {
            overflow: hidden;
            background-color: #000000;
            width: 100vw;
            height: 100vh;
        }
        #resize {
            position: absolute;
            height: 1099px;
            width: 1595px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            overflow: hidden;
        }
        #screen {
            width: 100%;
            height: 100%;
        }
        
        * {
  cursor: url("assets/ui/images/cursr.png") 0 0, auto;
}

button,
a,
.clickable,
.arrow,
.checkbox,
[style*="cursor: pointer"] {
  cursor: url("assets/ui/images/point.png") 2 2, pointer !important;
}
@font-face {
    font-family: "Doiscallme";
    src: url("fonts/DOCALLISMEONSTREET.ttf") format("truetype");
}
        #cutscene {
            top: 0;
            left: 0;
            display: none;
            z-index: 9999;
        }

.shaky {
    display: inline-block;
    animation: shake 0.1s infinite;
}

@keyframes shake {
    0% { transform: translate(0px, 0px); }
    25% { transform: translate(2px, -1px); }
    50% { transform: translate(-1px, 2px); }
    75% { transform: translate(1px, -2px); }
    100% { transform: translate(0px, 0px); }
}

.wave {
    display: inline-block;
    animation: wavv 1.5s infinite ease-in-out;
}

@keyframes wavv {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}
        #choice-container {
            display: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            position: absolute;
            z-index: 15;
        }
        .choice-btn {
            font-family: 'Blue Winter';
            color: white;
            font-size: 25px;
        }

        #dialogue-box {
  display: none;
  position: absolute;
  bottom: 10%;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  border: 15px solid #0b3d3e;
  padding: 16px 30px;
  box-sizing: border-box;
  padding-top: 30px;
  max-width: 1200px;
  width: 1200px;
  height: 250px;
  font-family: 'Patrick Hand', sans-serif;
  z-index: 3;
}
        
    </style>
</head>
<body>
    
    <div id= "resize">
<canvas id="screen"></canvas>

        <div id ="translation-box"></div>
        
        <div id="prompt">
            <div id="prompt-box">
                <p>Your device was detected as might needing mobile controls. Press Yes to confirm, No to continue with default controls</p>
                <button id="yes-btn" class="prompt-btn">Yes</button>
                <button id="no-btn" class="prompt-btn">No</button>
            </div>
        </div>

        <video id="cutscene" preload="auto" playsinline></video>

        <div id="choice-container"></div>
        
    <div id ="dialogue-background"></div>
    <img id ="dialogue-sprite" class ="sprite">
    <div id="dialogue-box">
  <div id="speaker-tag">
    <div id="dialogue-speaker"></div>
  </div>
  <div id="dialogue-text"></div>
</div>

    </div>
    
    <script>
        
        function resizeHTML() {
            const container = document.getElementById("resize");
            const scale = Math.min(window.innerWidth / 1595, window.innerHeight / 1099);
            container.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }
        
        window.addEventListener("resize", resizeHTML);
        
        resizeHTML();
        
    </script>
    
    <script type="module" src="funky.js"></script>
</body>
</html>
