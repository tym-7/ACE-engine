<!DOCTYPE html>
<html>
<head>
    <title>FNF: Dark Minds</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
        body {
            overflow: hidden;
            background-color: #000000;
            width: 100vw;
            height: 100vh;
        }
        #resize {
            position: absolute;
            height: 1099px;
            width: 1595px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            overflow: hidden;
        }
        #screen {
            width: 100%;
            height: 100%;
        }
        
        * {
  cursor: url("assets/ui/images/cursr.png") 0 0, auto;
}

button,
a,
.clickable,
.arrow,
.checkbox,
[style*="cursor: pointer"] {
  cursor: url("assets/ui/images/point.png") 2 2, pointer !important;
}
@font-face {
    font-family: "Doiscallme";
    src: url("fonts/DOCALLISMEONSTREET.ttf") format("truetype");
}

        #dialogue-box {
  display: none;
  position: absolute;
  bottom: 10%;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  border: 15px solid #0b3d3e;
  padding: 16px 30px;
  box-sizing: border-box;
    border-style: solid;
  padding-top: 30px;
  max-width: 1200px;
  width: 1200px;
  height: 250px;
  font-family: 'Patrick Hand', sans-serif;
  z-index: 3;
}
        
    </style>
</head>
<body>
    
    <div id= "resize">
<canvas id="screen"></canvas>
        
    <div id ="dialogue-background"></div>
    <img id ="dialogue-sprite" class ="sprite">
    <div id="dialogue-box">
  <div id="speaker-tag">
    <div id="dialogue-speaker"></div>
  </div>
  <div id="dialogue-text"></div>
</div>

    </div>
    
    <script>
        
        function resizeHTML() {
            const container = document.getElementById("resize");
            const scale = Math.min(window.innerWidth / 1595, window.innerHeight / 1099);
            container.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }
        
        window.addEventListener("resize", resizeHTML);
        
        resizeHTML();
        
    </script>
    
    <script type="module" src="funky.js"></script>
</body>
</html>
