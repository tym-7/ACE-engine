<!DOCTYPE html>
<html>
<head>
    <title>FNF: Dark Minds</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
        body {
            overflow: hidden;
            background-color: #000000;
        }
        * {
  cursor: url("assets/ui/cursr.png") 0 0, auto;
}

button,
a,
.clickable,
.arrow,
.checkbox,
[style*="cursor: pointer"] {
  cursor: url("assets/ui/point.png") 2 2, pointer !important;
}
@font-face {
    font-family: "Doiscallme";
    src: url("fonts/DOCALLISMEONSTREET.ttf") format("truetype");
}
        #dialogue-background {
  display: none;
  position: absolute;
            top: 0;
            left: 0;
  width: 1599px;
  height: 1099px;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  background-color: black; 
  z-index: 1;
}
        .sprite {
  position: absolute;
  display: none;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
  width: auto;
  height: auto;
}
    
.sprite.left {
  left: 30%;
  top: 47%;
  transform: translate(-54%, -55%);
}

.sprite.right {
  top: 47%;
  right: 55%;
  transform: translate(-14%, -55%);
}

.sprite.flip {
  scale: -1 1; 
}

        #dialogue-box {
  display: none;
  position: absolute;
  bottom: 10%;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  border: 15px solid #0b3d3e;
  padding: 16px 30px;
  box-sizing: border-box;
  padding-top: 30px;
  max-width: 1200px;
  width: 1200px;
  height: 250px;
  font-family: 'Patrick Hand', sans-serif;
  z-index: 3;
}
        
    </style>
</head>
<body>
    
    <div id ="dialogue-background"></div>
    <img id ="dialogue-sprite" class ="sprite">
    <div id="dialogue-box">
  <div id="speaker-tag">
    <div id="dialogue-speaker"></div>
  </div>
  <div id="dialogue-text"></div>
</div>
    
    <script type="module" src="funky.js"></script>
</body>
</html>
